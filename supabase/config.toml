# 完整配置说明参见：
# https://supabase.com/docs/guides/local-development/cli/config
# 用于区分同一主机上不同 Supabase 项目的标识，运行 `supabase init` 时默认取
# 当前工作目录名。
project_id = "blog"

[api]
enabled = true
# API URL 使用的端口。
port = 54321
# 在 API 中暴露的 schema，其中的表、视图与存储过程都会获得 API 端点；
# 默认包含 `public` 与 `graphql_public`。
schemas = ["public", "graphql_public"]
# 追加到每个请求 search_path 中的额外 schema。
extra_search_path = ["public", "extensions"]
# 单次查询从视图、表或存储过程返回的最大行数，用于限制意外或恶意请求的响应体积。
max_rows = 1000
# 控制 `postgres` 在 `public` schema 中新建的表、视图、序列与函数是否无需显式 GRANT
# 即可被 Data API 角色（`anon`、`authenticated`、`service_role`）访问，与云端默认行为一致。
# 设为 `false` 则要求显式 GRANT；未设置时，新项目回退为 `true`。
# auto_expose_new_tables = true

[api.tls]
# 本地使用自签名证书启用 HTTPS 端点。
enabled = false
# 自签名证书对的路径。
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# 本地数据库 URL 使用的端口。
port = 54322
# `db diff` 命令初始化 shadow 数据库时使用的端口。
shadow_port = 54320
# 启动本地数据库时等待健康检查的最长时间。
health_timeout = "2m"
# 使用的数据库主版本，必须与远端数据库一致；可在远端执行 `SHOW
# server_version;` 确认。
major_version = 17

[db.pooler]
enabled = false
# 本地连接池使用的端口。
port = 54329
# 指定服务端连接何时可被其他客户端复用。
# 可选池化模式：`transaction`、`session`。
pool_mode = "transaction"
# 每个「用户/数据库」组合允许的服务端连接数。
default_pool_size = 20
# 允许的最大客户端连接数。
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# 禁用后，`db push` 或 `db reset` 期间将跳过迁移。
enabled = true
# 按顺序描述数据库结构的 schema 文件、目录或 glob 模式列表。
# 支持相对于 supabase 目录的路径，例如 "./schemas/*.sql"、"./database"。
schema_paths = []

[db.seed]
# 启用后，在 `db reset` 时于迁移之后写入种子数据。
enabled = true
# 按顺序在 `db reset` 时加载的种子文件列表。
# 支持相对于 supabase 目录的 glob 模式，例如 "./seeds/*.sql"。
sql_paths = ["./seed.sql"]

[db.network_restrictions]
# 启用网络访问限制管理。
enabled = false
# 允许连接数据库的 IPv4 CIDR 列表。
# 默认允许全部 IPv4 连接，设为空数组则拒绝所有 IP。
allowed_cidrs = ["0.0.0.0/0"]
# 允许连接数据库的 IPv6 CIDR 列表。
# 默认允许全部 IPv6 连接，设为空数组则拒绝所有 IP。
allowed_cidrs_v6 = ["::/0"]

# 取消注释以拒绝到数据库的非加密连接。
# [db.ssl_enforcement]
# enabled = true

[realtime]
enabled = true
# realtime 绑定 IPv4 或 IPv6（默认 IPv4）。
# ip_version = "IPv6"
# HTTP 请求头的最大字节数（默认 4096）。
# max_header_length = 4096

[studio]
enabled = true
# Supabase Studio 使用的端口。
port = 54323
# 前端连接的 API 服务外部 URL。
api_url = "http://127.0.0.1"
# Supabase Studio 中 Supabase AI 使用的 OpenAI API Key。
openai_api_key = "env(OPENAI_API_KEY)"

# 邮件测试服务。本地开发环境发出的邮件不会真正投递，而是被拦截，
# 可在 Web 界面查看本应发出的邮件。
[local_smtp]
enabled = true
# 邮件测试服务 Web 界面使用的端口。
port = 54324
# 取消注释以暴露额外端口，用于测试会发邮件的用户应用。
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# 允许的最大文件体积（如 "5MB"、"500KB"）。
file_size_limit = "50MiB"

# 取消注释以配置本地 storage bucket
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

# 允许通过兼容 S3 的客户端连接
[storage.s3_protocol]
enabled = true

# 图像变换 API 仅在 Supabase Pro 套餐可用。
# [storage.image_transformation]
# enabled = true

# 将分析数据存入 S3，便于在 Iceberg Catalog 上运行 ETL 任务。
# 该功能仅在托管平台可用。
[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

# Analytics Buckets 仅在 Supabase Pro 套餐可用。
# [storage.analytics.buckets.my-warehouse]

# 将向量嵌入存入 S3，用于大规模、长期保存的数据集。
[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 5

# Vector Buckets 仅在 Supabase Pro 套餐可用。
# [storage.vector.buckets.documents-openai]

[auth]
enabled = true
# 站点基础 URL，用作重定向白名单，并用于构造邮件中的链接。
site_url = "http://127.0.0.1:3000"
# Auth 对外服务的公共 URL，默认为 API 外部 URL 追加 `/auth/v1`。
# external_url = ""
# 认证成功后允许认证提供方重定向到的*精确* URL 列表。
additional_redirect_urls = ["https://127.0.0.1:3000"]
# token 有效期（秒），默认 3600（1 小时），最大 604800（1 周）。
jwt_expiry = 3600
# JWT 签发者 URL；未设置时默认为 auth.external_url。
# jwt_issuer = ""
# JWT 签名密钥路径。切勿将签名密钥文件提交到 git。
# signing_keys_path = "./signing_keys.json"
# 禁用后 refresh token 永不过期。
enable_refresh_token_rotation = true
# 允许 refresh token 过期后在指定秒数内被复用。
# 需 enable_refresh_token_rotation = true。
refresh_token_reuse_interval = 10
# 允许/禁止新用户注册。
enable_signup = true
# 允许/禁止匿名登录。
enable_anonymous_sign_ins = false
# 允许/禁止测试手动关联账号
enable_manual_linking = false
# 短于该值的密码会被判定为弱密码并拒绝；最小 6，建议 8 及以上。
minimum_password_length = 6
# 不满足以下要求的密码会被判定为弱密码并拒绝，可选值：
# `letters_digits`、`lower_upper_letters_digits`、`lower_upper_letters_digits_symbols`
password_requirements = ""

# 配置 passkey 登录。
# [auth.passkey]
# enabled = false

# 配置 WebAuthn 依赖方设置（启用 passkey 时必填）。
# [auth.webauthn]
# rp_display_name = "Supabase"
# rp_id = "localhost"
# rp_origins = ["http://127.0.0.1:3000"]

[auth.rate_limit]
# 每小时可发送的邮件数；需启用 auth.email.smtp。
email_sent = 2
# 每小时可发送的短信数；需启用 auth.sms。
sms_sent = 30
# 每个 IP 每小时可进行的匿名登录次数；需 enable_anonymous_sign_ins = true。
anonymous_users = 30
# 每个 IP 在 5 分钟内可刷新的会话数。
token_refresh = 150
# 每个 IP 在 5 分钟内可发起的注册与登录请求数（不含匿名用户）。
sign_in_sign_ups = 30
# 每个 IP 在 5 分钟内可进行的 OTP / Magic link 验证次数。
token_verifications = 30
# 每个 IP 在 5 分钟内可进行的 Web3 登录次数。
web3 = 30

# 配置受支持的 captcha 提供方：`hcaptcha` 或 `turnstile`。
# [auth.captcha]
# enabled = true
# provider = "hcaptcha"
# secret = ""

[auth.email]
# 允许/禁止通过邮箱注册。
enable_signup = true
# 启用后，修改邮箱需在旧、新邮箱地址上分别确认；禁用则只需确认新邮箱。
double_confirm_changes = true
# 启用后，用户需先确认邮箱地址才能登录。
enable_confirmations = false
# 启用后，用户修改密码前需重新认证或近期登录过。
secure_password_change = false
# 发送下一封注册确认或重置密码邮件前必须间隔的最短时间。
max_frequency = "1s"
# 邮件 OTP 的字符数。
otp_length = 6
# 邮件 OTP 的过期秒数（默认 1 小时）。
otp_expiry = 3600

# 使用生产可用的 SMTP 服务
# [auth.email.smtp]
# enabled = true
# host = "smtp.sendgrid.net"
# port = 587
# user = "apikey"
# pass = "env(SENDGRID_API_KEY)"
# admin_email = "admin@email.com"
# sender_name = "Admin"

# 取消注释以自定义邮件模板
# [auth.email.template.invite]
# subject = "You have been invited"
# content_path = "./supabase/templates/invite.html"

# 取消注释以自定义通知邮件模板
# [auth.email.notification.password_changed]
# enabled = true
# subject = "Your password has been changed"
# content_path = "./supabase/templates/password_changed_notification.html"

[auth.sms]
# 允许/禁止通过短信注册。
enable_signup = false
# 启用后，用户需先确认手机号才能登录。
enable_confirmations = false
# 向用户发送 OTP 的短信模板
template = "Your code is {{ .Code }}"
# 发送下一条短信 OTP 前必须间隔的最短时间。
max_frequency = "5s"

# 使用预定义的手机号到 OTP 映射用于测试。
# [auth.sms.test_otp]
# 4152127777 = "123456"

# 配置登录会话超时。
# [auth.sessions]
# 超过指定时长后强制登出。
# timebox = "24h"
# 用户闲置超过指定时长后强制登出。
# inactivity_timeout = "8h"

# 该 hook 在新用户创建前运行，可依据传入的用户对象拒绝该请求。
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# 该 hook 在签发 token 前运行，可依据所用认证方式追加 claim。
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# 配置受支持的短信提供方：`twilio`、`twilio_verify`、`messagebird`、`textlocal`、`vonage`。
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# 切勿将 Twilio auth token 提交到 git，改用环境变量替换：
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# 多因素认证（MFA）仅在 Supabase Pro 套餐可用。
[auth.mfa]
# 控制每个用户可同时绑定的 MFA 因子数量。
max_enrolled_factors = 10

# 通过 App Authenticator（TOTP）控制 MFA
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

# 通过手机短信配置 MFA
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# 通过 WebAuthn 配置 MFA
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# 使用外部 OAuth 提供方，完整列表：`apple`、`azure`、`bitbucket`、`discord`、`facebook`、
# `github`、`gitlab`、`google`、`keycloak`、`linkedin_oidc`、`notion`、`twitch`、`twitter`、
# `x`、`slack`、`spotify`、`workos`、`zoom`。
[auth.external.apple]
enabled = false
client_id = ""
# 切勿将 OAuth 提供方 secret 提交到 git，改用环境变量替换：
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# 覆盖由 auth.external_url 推导出的默认认证回调 URL。
redirect_uri = ""
# 覆盖默认认证提供方 URL，用于支持自建 gitlab、单租户 Azure
# 或其他第三方 OIDC 提供方。
url = ""
# 启用后跳过 nonce 校验；使用 Google 认证本地登录时需要。
skip_nonce_check = false
# 启用后，即使提供方未返回邮箱地址也允许认证成功。
email_optional = false

# 允许 Solana 钱包持有者通过 Sign in with Solana（SIWS，EIP-4361）标准登录。
# 可在 [auth.rate_limit] 中配置 "web3" 限流，自托管时还需配置 [auth.captcha]。
[auth.web3.solana]
enabled = false

# 将 Firebase Auth 作为第三方提供方与 Supabase Auth 并用。
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# 将 Auth0 作为第三方提供方与 Supabase Auth 并用。
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# 将 AWS Cognito（Amplify）作为第三方提供方与 Supabase Auth 并用。
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

# 将 Clerk 作为第三方提供方与 Supabase Auth 并用。
[auth.third_party.clerk]
enabled = false
# 获取地址：https://clerk.com/setup/supabase
# domain = "example.clerk.accounts.dev"

# OAuth 服务端配置
[auth.oauth_server]
# 启用 OAuth 服务端功能
enabled = false
# OAuth 授权同意流程 UI 的路径
authorization_url_path = "/oauth/consent"
# 允许动态注册客户端
allow_dynamic_registration = false

[edge_runtime]
enabled = true
# 支持的请求策略：`oneshot`、`per_worker`。
# `per_worker`（默认）在本地开发时支持热重载；
# `oneshot` 是在热重载出现问题时（如大型仓库或使用符号链接）的回退模式。
policy = "per_worker"
# 调试 edge functions 时 Chrome inspector 附加的端口。
inspector_port = 8083
# 使用的 Deno 主版本。
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

[analytics]
enabled = true
port = 54327
# 配置受支持的后端：`postgres` 或 `bigquery`。
backend = "postgres"

# 实验性功能可能随时被废弃
[experimental]
# 配置 Postgres 存储引擎使用 OrioleDB（S3）
orioledb_version = ""
# 配置 S3 bucket URL，例如 <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# 配置 S3 bucket 区域，例如 us-east-1
s3_region = "env(S3_REGION)"
# 配置 S3 bucket 的 AWS_ACCESS_KEY_ID
s3_access_key = "env(S3_ACCESS_KEY)"
# 配置 S3 bucket 的 AWS_SECRET_ACCESS_KEY
s3_secret_key = "env(S3_SECRET_KEY)"

# pg-delta 是 db diff / db pull / db remote commit 使用的 schema 差异引擎。
# 设 enabled = false 可回退到旧版 migra 引擎。
[experimental.pgdelta]
enabled = true
# 声明式文件写入的目录（位于 `supabase/` 下）。
# declarative_schema_path = "./schemas"
# 传给 pg-delta SQL 格式化的 JSON 字符串。省略时按关键字大写、缩进 2、最大宽度 180、
# 尾随逗号、列与键对齐的规则格式化；设为 "null" 则输出未格式化的原始 SQL。
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":180,\"commaStyle\":\"trailing\"}"
