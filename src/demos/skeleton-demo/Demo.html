<div class="nd-sk" data-skeleton-native>
  <div class="nd-sk-host" data-sk-host aria-busy="true">
    <div class="nd-sk-skeleton" aria-hidden="true">
      <div class="nd-sk-head">
        <div class="nd-sk-cell nd-sk-avatar"></div>
        <div class="nd-sk-head-lines">
          <div class="nd-sk-cell nd-sk-line nd-sk-w60"></div>
          <div class="nd-sk-cell nd-sk-line nd-sk-w40"></div>
        </div>
      </div>
      <div class="nd-sk-cell nd-sk-box"></div>
      <div class="nd-sk-cell nd-sk-line nd-sk-w90"></div>
      <div class="nd-sk-cell nd-sk-line nd-sk-w75"></div>
    </div>
  </div>

  <button type="button" class="nd-sk-toggle" data-sk-toggle>结束加载</button>

  <!-- 真实内容放在 template 里，加载结束后克隆进宿主容器 -->
  <template data-sk-content>
    <article class="nd-content">
      <div class="nd-content-head">
        <span class="nd-avatar">M</span>
        <div class="nd-content-meta">
          <span class="nd-name">Mimas</span>
          <span class="nd-sub">前端 · 工程实践</span>
        </div>
      </div>
      <p class="nd-body">
        骨架节点与真实内容在同一个容器内互换，加载完成后原样恢复。
      </p>
    </article>
  </template>
</div>

<style>
  .nd-sk {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    height: 100%;
    padding: 0.75rem;
  }

  .nd-sk-host {
    flex: 1;
    min-height: 0;
  }

  /* ---------- 骨架态 ---------- */
  .nd-sk-skeleton {
    display: grid;
    gap: 0.55rem;
    align-content: start;
  }

  .nd-sk-head {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .nd-sk-head-lines {
    flex: 1;
    display: grid;
    gap: 0.35rem;
  }

  .nd-sk-cell {
    position: relative;
    overflow: hidden;
    border-radius: 0.375rem;
    background-color: color-mix(
      in oklab,
      var(--color-foreground) 10%,
      var(--color-muted)
    );
  }

  .nd-sk-cell::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(
      90deg,
      transparent,
      color-mix(in oklab, var(--color-foreground) 18%, transparent),
      transparent
    );
    animation: nd-shimmer 1.6s ease-in-out infinite;
  }

  .nd-sk-avatar {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 999px;
    flex: none;
  }

  .nd-sk-line {
    height: 0.55rem;
    border-radius: 999px;
  }

  .nd-sk-box {
    height: 2.4rem;
    border-radius: 0.5rem;
  }

  .nd-sk-w40 {
    width: 40%;
  }
  .nd-sk-w60 {
    width: 60%;
  }
  .nd-sk-w75 {
    width: 75%;
  }
  .nd-sk-w90 {
    width: 90%;
  }

  @keyframes nd-shimmer {
    to {
      transform: translateX(100%);
    }
  }

  /* ---------- 真实内容 ---------- */
  .nd-content {
    display: grid;
    gap: 0.5rem;
    font-size: 0.875rem;
  }

  .nd-content-head {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .nd-avatar {
    display: grid;
    place-items: center;
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 999px;
    background: color-mix(in oklab, var(--color-accent) 15%, transparent);
    color: var(--color-accent);
    font-weight: 600;
  }

  .nd-content-meta {
    display: grid;
  }

  .nd-name {
    font-weight: 600;
  }

  .nd-sub {
    color: var(--color-muted-foreground);
    font-size: 0.75rem;
  }

  .nd-body {
    color: var(--color-muted-foreground);
    line-height: 1.625;
  }

  .nd-sk-toggle {
    align-self: flex-end;
    padding: 0.25rem 0.625rem;
    border: 1px solid var(--color-border);
    border-radius: 0.25rem;
    background: transparent;
    color: var(--color-foreground);
    font-size: 0.75rem;
    cursor: pointer;
  }

  .nd-sk-toggle:hover {
    border-color: var(--color-accent);
  }

  /* 系统偏好：减少动效 */
  @media (prefers-reduced-motion: reduce) {
    .nd-sk-cell::after {
      display: none;
    }
  }

  /* 站点阅读设置里的"简略动画效果"开关 */
  html[data-simple-animation="on"] .nd-sk-cell::after {
    display: none;
  }
</style>

<script data-astro-rerun>
  (function () {
    document
      .querySelectorAll("[data-skeleton-native]")
      .forEach(function (root) {
        var host = root.querySelector("[data-sk-host]");
        var btn = root.querySelector("[data-sk-toggle]");
        var tpl = root.querySelector("[data-sk-content]");
        if (!host || !btn || !tpl || btn.dataset.bound === "1") return;
        btn.dataset.bound = "1";

        // 记录初始骨架结构，切回加载态时原样还原
        var skeleton = host.innerHTML;
        var loading = true;

        btn.addEventListener("click", function () {
          loading = !loading;
          host.setAttribute("aria-busy", loading ? "true" : "false");
          if (loading) {
            host.innerHTML = skeleton;
          } else {
            host.replaceChildren(tpl.content.cloneNode(true));
          }
          btn.textContent = loading ? "结束加载" : "重新加载";
        });
      });
  })();
</script>
